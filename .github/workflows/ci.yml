name: CI Pipeline

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest pytest-cov

    - name: Run basic test
      run: |
        python -c "import flask; print('Flask imported successfully')"

    - name: Run Flake8 Linting
      run: |
        flake8 .

    #- name: Run Tests with Coverage
    #  run: |
    #   pytest --cov=app --cov-fail-under=80
  
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Convert repository name to lowercase
      run: |
        echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Read base version
      run: |
        BASE_VERSION=$(cat VERSION)
        echo "BASE_VERSION=$BASE_VERSION" >> $GITHUB_ENV

    - name: Generate semantic version
      run: |
        PATCH=${{ github.run_number }}
        SEMVER="${BASE_VERSION%.*}.$PATCH"
        echo "SEMVER=$SEMVER" >> $GITHUB_ENV
        echo "Version generated: $SEMVER"
        
    - name: Build Docker image (SemVer + latest)
      run: |
        docker build \
          -t ghcr.io/${{ env.REPO_LOWER }}/flask-app:${{ env.SEMVER }} \
          -t ghcr.io/${{ env.REPO_LOWER }}/flask-app:latest .

    - name: Push Docker images
      run: |
        docker push ghcr.io/${{ env.REPO_LOWER }}/flask-app:${{ env.SEMVER }}
        docker push ghcr.io/${{ env.REPO_LOWER }}/flask-app:latest
    
    - name: Create build artifact
      run: |
        echo "Application: Flask CI/CD App" > build-info.txt
        echo "Version: ${{ env.SEMVER }}" >> build-info.txt
        echo "Commit: ${{ github.sha }}" >> build-info.txt
        echo "Build Time: $(date)" >> build-info.txt

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: flask-app-${{ env.SEMVER }}
        path: build-info.txt
    
    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@v2
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.sources=.
          -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
    
    - name: Deploy using Docker Compose
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          docker-compose pull
          docker-compose up -d
